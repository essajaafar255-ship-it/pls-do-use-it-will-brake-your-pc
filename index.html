<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Mod</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: #2a2a2a;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 2px solid #555;
            max-width: 500px;
        }
        h1 {
            color: #52ec42;
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-transform: uppercase;
            text-shadow: 2px 2px #000;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #dddddd;
            margin-bottom: 15px;
        }
        .instruction {
            font-size: 1.1rem;
            color: #ffb703;
            font-weight: bold;
            margin-bottom: 25px;
        }
        .download-btn {
            display: inline-block;
            background-color: #52ec42;
            color: #1a1a1a;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 5px;
            box-shadow: 0 4px #2b9e20, 0 6px 10px rgba(0,0,0,0.4);
            transition: all 0.1s ease;
            cursor: pointer;
        }
        .download-btn:hover {
            background-color: #63f154;
            box-shadow: 0 4px #34bd28, 0 6px 12px rgba(0,0,0,0.5);
            transform: translateY(-2px);
        }
        .download-btn:active {
            box-shadow: 0 0px #2b9e20, 0 2px 5px rgba(0,0,0,0.4);
            transform: translateY(4px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Updated Title -->
        <h1>Minecraft Mod</h1>
        
        <p>This file is required and actively used by your installed Minecraft mods.</p>
        
        <!-- Extraction Instruction -->
        <p class="instruction">Please extract all files after downloading.</p>
        
        <!-- Replace 'your-archive-name.zip' with your local filename or server link -->
        <a href="mod.zip" class="download-btn" download>Download File</a>

    </div>

</body>
</html>
